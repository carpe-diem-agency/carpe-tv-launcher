name: Release draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag matching versionName (for example v0.1.0-alpha.1)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-draft
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: Validate tag and signing configuration
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          python3 scripts/check_repository.py
          python3 - <<'PYCODE'
          import base64, os, pathlib, re
          version = re.search(r"versionName '([^']+)'", pathlib.Path('app/build.gradle').read_text()).group(1)
          tag = os.environ['RELEASE_TAG']
          if tag != 'v' + version:
              raise SystemExit('Tag must exactly match v + APK versionName')
          for name in ('KEYSTORE_BASE64','ANDROID_STORE_PASSWORD','ANDROID_KEY_ALIAS','ANDROID_KEY_PASSWORD','RELEASE_CERT_SHA256'):
              if not os.environ.get(name): raise SystemExit('Release signing secrets are not configured')
          if not re.fullmatch(r'[0-9a-fA-F]{64}', os.environ['RELEASE_CERT_SHA256'].replace(':','')):
              raise SystemExit('RELEASE_CERT_SHA256 must be a SHA-256 certificate digest')
          key = pathlib.Path(os.environ['RUNNER_TEMP'])/'release.jks'
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True)); key.chmod(0o600)
          PYCODE
      - name: Build signed release and lint
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease lintDebug
      - name: Verify and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          generated = Path('app/build/generated/source/buildConfig/release/agency/carpediem/tv/prototype/BuildConfig.java').read_text()
          feed = 'UPDATE_FEED_URL = "https://api.github.com/repos/carpe-diem-agency/carpe-tv-launcher/releases/latest";'
          if feed not in generated:
              raise SystemExit('Release APK is missing the public update feed')
          PYCODE
          python3 scripts/check_release_apk.py app/build/outputs/apk/release/app-release.apk
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APK_SIGNER"
          "$APK_SIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$APK_SIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/apk-certs.txt"
          python3 - <<'PYCODE'
          import os, pathlib, re
          output = pathlib.Path(os.environ['RUNNER_TEMP'], 'apk-certs.txt').read_text()
          found = re.findall(r'Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F:]+)', output)
          expected = os.environ['RELEASE_CERT_SHA256'].replace(':', '').lower()
          if len(found) != 1 or found[0].replace(':', '').lower() != expected:
              raise SystemExit('APK signing certificate differs from the pinned release identity')
          PYCODE
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/carpe-tv.apk
          cp compliance/source/spake2-java-2.2.1-with-submodule.tar.gz dist/
          (cd compliance/source && sha256sum -c SHA256SUMS)
          (cd dist && sha256sum carpe-tv.apk spake2-java-2.2.1-with-submodule.tar.gz > SHA256SUMS)
          python3 scripts/make_update_manifest.py dist/carpe-tv.apk --expected-application-id agency.carpediem.tv --apk-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/carpe-tv.apk" --output dist/update.json
          gh release create "$RELEASE_TAG" dist/carpe-tv.apk dist/SHA256SUMS dist/update.json dist/spake2-java-2.2.1-with-submodule.tar.gz --draft --prerelease --target "$GITHUB_SHA" --title "Carpe TV $RELEASE_TAG" --notes-file CHANGELOG.md
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
