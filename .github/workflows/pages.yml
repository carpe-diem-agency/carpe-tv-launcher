name: Publish install page

'on':
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !github.event.repository.private && (github.event_name != 'release' || (!github.event.release.prerelease && !github.event.release.draft)) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Verify release files
        if: ${{ github.event_name == 'release' }}
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          jq -e '([.release.assets[].name] | index("carpe-tv.apk") != null and index("SHA256SUMS") != null and index("update.json") != null and index("spake2-java-2.2.1-with-submodule.tar.gz") != null)' "$EVENT_PATH"
      - name: Check whether a stable APK already exists
        id: stable
        if: ${{ github.event_name != 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          if curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$url" \
            | jq -e '([.assets[]?.name] | index("carpe-tv.apk") != null and index("SHA256SUMS") != null and index("update.json") != null and index("spake2-java-2.2.1-with-submodule.tar.gz") != null)' >/dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify latest stable release assets before showing download
        if: ${{ github.event_name == 'release' || steps.stable.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            event_tag="$(jq -r '.release.tag_name' "$EVENT_PATH")"
            test "$tag" = "$event_tag"
          fi
          mkdir -p "$RUNNER_TEMP/pages-release"
          gh release download "$tag" --dir "$RUNNER_TEMP/pages-release" \
            --pattern 'carpe-tv.apk' --pattern 'SHA256SUMS' \
            --pattern 'update.json' --pattern 'spake2-java-2.2.1-with-submodule.tar.gz'
          python3 scripts/verify_pages_release.py "$RUNNER_TEMP/pages-release" \
            --repository "$GITHUB_REPOSITORY" --tag "$tag"
      - name: Prepare only the public install page
        run: |
          mkdir -p site/assets
          cp docs/index.html site/index.html
          cp docs/robots.txt docs/sitemap.xml site/
          cp docs/assets/wallpaper_alpine.jpg site/assets/wallpaper_alpine.jpg
          cp docs/assets/home-preview.jpg site/assets/home-preview.jpg
          cp docs/assets/google-tv-home-test-stick.png site/assets/google-tv-home-test-stick.png
          cp docs/assets/settings-preview.jpg site/assets/settings-preview.jpg
          cp docs/assets/interface-preview.mp4 site/assets/interface-preview.mp4
      - name: Mark preview until a stable APK release
        if: ${{ github.event_name != 'release' && steps.stable.outputs.ready != 'true' }}
        run: python3 scripts/prepare_pages_preview.py site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
