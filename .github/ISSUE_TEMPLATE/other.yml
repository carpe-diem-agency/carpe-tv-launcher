name: Інше / Other feedback
description: Поділись відгуком або запитанням / Share feedback or a question
title: "[Feedback] "
body:
  - type: textarea
    id: device
    attributes:
      label: Інформація для діагностики · Diagnostic information
      description: Необов’язково; QR-код Carpe TV заповнює автоматично. Переглянь перед надсиланням. / Optional; filled by the Carpe TV QR code. Review before submitting.
    validations:
      required: false
  - type: textarea
    id: message
    attributes:
      label: Повідомлення · Message
      description: Не додавай паролі, IP-адреси, серійні номери чи особисті дані. / Do not include credentials, IP addresses, serial numbers or personal information.
    validations:
      required: true
